[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "filewatcher-cli"
version = "1.0.0"
description = "🔍 FileWatcher-CLI - 轻量级终端文件变更智能监控与自动响应引擎"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "SoloBot"},
]
keywords = ["file-watcher", "cli", "monitor", "file-changes", "auto-response", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
filewatcher = "filewatcher.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/FileWatcher-CLI"
Repository = "https://github.com/gitstq/FileWatcher-CLI"
Issues = "https://github.com/gitstq/FileWatcher-CLI/issues"
